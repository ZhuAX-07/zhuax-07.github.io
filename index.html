  function b64(s) { var bin = atob(s); var a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
  function unlock() {
    var pass = document.getElementById('pw').value;
    var msg = document.getElementById('msg');
    msg.classList.remove('show');
    if (!pass) { msg.classList.add('show'); return; }
    var te = new TextEncoder();
    crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) { return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITERS, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']); })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV), tagLength: 128 }, key, b64(DATA)); })
      .then(function (pt) { var html = new TextDecoder().decode(pt); document.open(); document.write(html); document.close(); })
      .catch(function () { msg.classList.add('show'); });
